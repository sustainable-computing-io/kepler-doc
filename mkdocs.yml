site_name: Kepler
site_url: https://sustainable-computing.io/
theme:
  palette:
    primary: teal
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  language: en
  custom_dir: overrides
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.integrate

  highlightjs: true
  hljs_languages:
    - yaml
    - rust

docs_dir: ./docs
nav:
  - Docs:
      - index.md
      - Installation:
          - Quick Start: kepler/installation/guide.md
          - Helm Updates: kepler/installation/helm-updates.md
          - Configuration: kepler/usage/configuration.md
      - Guides:
          - Power Attribution: kepler/usage/power-attribution.md
      - Metrics: kepler/design/metrics.md
      - Developer:
          - Guides: kepler/developer/dev-docs.md
      - Kepler Operator:
          - OpenShift:
              - Overview: kepler-operator/openshift/index.md
              - Quick Start: kepler-operator/openshift/quickstart.md
              - CLI Installation: kepler-operator/openshift/cli-installation.md
          - Usage:
              - Configuration Guide: kepler-operator/configuration/index.md
              - Monitoring & Troubleshooting: kepler-operator/configuration/monitoring-troubleshooting.md
          - Migration:
              - Kepler to PowerMonitor: kepler-operator/migration/index.md
  - Adopters: project/adopters.md
  - Resources: project/resources.md
  - Contributing: project/contributing.md
  - Support: project/support.md

# Archive pages publish as the frozen v0.9 version (mkdocs.v0.9.yml)
exclude_docs: |
  archive/
  model-server-compatibility*.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/adopters.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header.js

copyright: Copyright &copy; Contributors to the Kepler project

extra:
  version:
    provider: mike
    default: latest
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sustainable-computing-io/kepler
      name: Kepler on GitHub
    - icon: fontawesome/brands/slack
      link: https://cloud-native.slack.com/archives/C05QK3KN3HT
      name: "#kepler-project on CNCF Slack"

plugins:
  - search:
      lang:
        - en
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: Chinese
          build: true
